id: time_order_statement
extends: semunit:assertionalStatementUnit
execution_layer: 20
resolution:
  resolved_order:
  - statement_unit_type
  - statement_unit_type_local
  - semantic_unit_map
  - roles
  - resources
  - emit_semantic_unit_has_time
  - emit_subject_in_time_position
  - time_position_type
  - label_map
  statement_unit_type: true
  semantic_unit: true
  roles:
    subject:
      path: roles.subject
      required: true
      default_term_type: iri
    position:
      path:
      - position
      - roles.position
      required: true
      default_term_type: literal
  resources:
    time_position:
      path: resources.time_position
      default_template: ex:TimePosition/{Observation_ID}_{instance_id}
    temporal_entity:
      path: resources.temporal_entity
  values:
    emit_semantic_unit_has_time:
      kind: bool
      path: emit_semantic_unit_has_time
      default: false
    emit_subject_in_time_position:
      kind: bool
      path: emit_subject_in_time_position
      default: false
    time_position_type:
      kind: iri
      path: time_position_type
      default: time:timePosition
emit_bundles:
- id: semantic_unit_resource
  kind: semantic_unit_resource
  subject_map: semantic_unit.subject_map
  graph_map: default
  predicate_object_maps:
  - predicate_map:
      constant: rdf:type
    object_map:
      constant: statement_unit_type
      term_type: iri
  - predicate_map:
      constant: rdf:type
    object_map:
      constant: semunit:assertionalStatementUnit
      term_type: iri
  - predicate_map:
      constant: semunit:hasSemanticUnitSubject
    object_map: roles.subject
- id: time_position_resource
  kind: minted_resource
  subject_map: resources.time_position
  graph_map: default
  predicate_object_maps:
  - predicate_map:
      constant: rdf:type
    object_map:
      constant: time_position_type
      term_type: iri
- id: time_position_graph
  kind: assertion_graph
  subject_map: resources.time_position
  graph_map: semantic_unit.subject_map
  predicate_object_maps:
  - predicate_map:
      constant: time:numericPosition
    object_map: roles.position
- id: semantic_unit_has_time_graph
  kind: assertion_graph
  when: emit_semantic_unit_has_time
  subject_map: semantic_unit.subject_map
  graph_map: roles.subject
  predicate_object_maps:
  - predicate_map:
      constant: time:hasTime
    object_map: resources.temporal_entity
- id: subject_in_time_position_graph
  kind: assertion_graph
  when: emit_subject_in_time_position
  subject_map: roles.subject
  graph_map: semantic_unit.subject_map
  predicate_object_maps:
  - predicate_map:
      constant: time:inTimePosition
    object_map: resources.time_position
default_label_map:
  template: 'Time order: position {position}'
  tokens:
    position:
      from: roles.position
