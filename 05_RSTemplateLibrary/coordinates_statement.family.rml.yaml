id: coordinates_statement
extends: semunit:assertionalStatementUnit
execution_layer: 10
resolution:
  resolved_order:
  - statement_unit_type
  - statement_unit_type_local
  - semantic_unit_map
  - roles
  - label_map
  statement_unit_type: true
  semantic_unit: true
  roles:
    subject:
      path: roles.subject
      required: true
      default_term_type: iri
    latitude:
      path: roles.latitude
      required: true
      default_term_type: literal
    longitude:
      path: roles.longitude
      required: true
      default_term_type: literal
emit_bundles:
- id: semantic_unit_resource
  subject_map: semantic_unit.subject_map
  graph_map: default
  predicate_object_maps:
  - predicate_map:
      constant: rdf:type
    object_map:
      constant: statement_unit_type
      term_type: iri
  - predicate_map:
      constant: rdf:type
    object_map:
      constant: semunit:assertionalStatementUnit
      term_type: iri
  - predicate_map:
      constant: semunit:hasSemanticUnitSubject
    object_map: roles.subject
- id: assertion_graph
  subject_map: roles.subject
  graph_map: semantic_unit.subject_map
  predicate_object_maps:
  - predicate_map:
      constant: geo:lat
    object_map: roles.latitude
  - predicate_map:
      constant: geo:long
    object_map: roles.longitude
default_label_map:
  template: '{subject} has lat {latitude} and long {longitude}'
  tokens:
    subject:
      from_entity_label: roles.subject
    latitude:
      from: roles.latitude
    longitude:
      from: roles.longitude
